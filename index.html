<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="calculator-version" content="2.9.1">
  <meta name="theme-color" content="#123e31">
  <meta name="description" content="حساب نقاط لعبة الهند للأفرقة واللعب الفردي.">
  <title>حاسبة الهند – النخبة</title>
  <link rel="stylesheet" href="./styles.css?v=2.9.1">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-top">
        <div class="header-tools">
          <details id="settings-menu">
            <summary aria-label="القائمة">☰</summary>
            <button id="settings-open" class="secondary" type="button">الإعدادات</button>
          </details>
          <button id="check-update" type="button" aria-label="التحقق من تحديث الحاسبة" title="التحقق من تحديث الحاسبة" hidden>↻</button>
        </div>
        <h1><span aria-hidden="true">♠</span> حاسبة الهند <span aria-hidden="true">♠</span></h1>
        <button id="reset" class="reset" type="button" hidden>مباراة جديدة <span aria-hidden="true">+</span></button>
      </div>
      <div class="edition-panel" role="img" aria-label="النخبة"><bdi id="edition-name" hidden></bdi></div>
    </div>
  </header>
  <aside class="update-banner shell" id="update-banner" hidden>
    <span role="status">يتوفر تحديث جديد</span>
    <button class="primary" id="apply-update" type="button">تحديث الآن</button>
  </aside>
  <button id="live-start" class="primary" type="button" aria-controls="live-panel" aria-expanded="false" hidden>مشاركة القيد</button>
  <section id="live-panel" aria-label="مشاركة القيد المباشر" hidden>
    <div class="controls">
      <a id="live-whatsapp" class="secondary" target="_blank" rel="noopener noreferrer" hidden>مشاركة عبر واتساب</a>
      <button id="live-rename" class="secondary" type="button" hidden>تعديل الأسماء</button>
      <button id="live-stop" class="secondary" type="button" hidden>إيقاف المشاركة المباشرة</button>
    </div>
    <input id="live-link" type="url" dir="ltr" aria-label="رابط مشاهدة القيد" readonly hidden>
    <div id="live-status" class="subtle" role="status"></div>
  </section>
  <dialog id="live-names-dialog" aria-labelledby="live-names-title">
    <form class="panel" id="live-names-form">
      <h2 id="live-names-title">تعديل الأسماء</h2>
      <div id="live-name-fields"></div>
      <div class="controls">
        <button class="primary" type="submit">حفظ الأسماء</button>
        <button id="live-cancel-names" class="secondary" type="button">إلغاء</button>
      </div>
    </form>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form" class="panel">
      <div class="panel-heading"><h2 id="settings-title">الإعدادات</h2>
        <button id="settings-close" class="secondary" type="button">إغلاق</button></div>
      <label>اسم الديوانية<input name="name" maxlength="40" dir="auto" required></label>
      <fieldset id="settings-themes">
        <legend>الثيم</legend>
        <div id="theme-options"></div>
      </fieldset>
      <p id="settings-lock" class="subtle" hidden>يمكن تعديل قوانين اللعب بعد انتهاء القيد الجاري.</p>
      <fieldset id="settings-rules">
        <legend>قوانين اللعب</legend>
        <label>عدد اللعبات الأساسي<select name="baseRounds">
          <option value="5">خمس لعبات</option>
          <option value="7">سبع لعبات</option>
        </select></label>
        <label>عدد الجياكر<select name="jokers">
          <option value="2">جيكرين</option><option value="3">ثلاث جياكر</option>
        </select></label>
        <label class="settings-check"><input type="checkbox" name="penaltyEnabled">تفعيل الشرهة</label>
        <p class="subtle">تُطبّق الشرهة في الأنظمة التي تدعمها. مباراة الفريقين تبقى بلا شرهة.</p>
      </fieldset>
      <div class="controls">
        <button class="primary" type="submit">حفظ الإعدادات</button>
        <button id="settings-defaults" class="secondary" type="button">استعادة الإعدادات الافتراضية</button>
      </div>
    </form>
  </dialog>
  <main id="app" class="shell"></main>
  <div class="archive-launch shell"><button id="archive-open" class="secondary" type="button">سجل المباريات</button></div>
  <dialog id="archive-dialog" aria-labelledby="archive-title">
    <section class="panel">
      <div class="panel-heading"><h2 id="archive-title">سجل المباريات</h2>
        <button id="archive-close" class="secondary" type="button" autofocus>إغلاق</button></div>
      <div id="archive-content"></div>
    </section>
  </dialog>
  <footer class="version">الإصدار <bdi>2.9.1</bdi></footer>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="kabru-dialog" aria-labelledby="kabru-title">
    <div class="kabru-screen">
      <h1 id="kabru-title">كابروا</h1>
      <div class="kabru-stage" role="img"><div class="kabru-wheel"></div><span class="kabru-pointer"></span></div>
      <div id="kabru-result" role="status"></div>
      <div class="kabru-actions">
        <button id="kabru-spin" class="kabru-gold" type="button">كابروا</button>
        <button id="kabru-back" class="secondary" type="button">العودة للعبة</button>
      </div>
    </div>
  </dialog>
  <dialog id="victory-dialog" aria-labelledby="victory-title">
    <div class="victory-confetti" aria-hidden="true"></div>
    <div class="victory-cloud">
      <div class="victory-lobes" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="victory-message">
        <span class="victory-trophy" aria-hidden="true">🏆</span>
        <h2 id="victory-title" tabindex="-1" autofocus></h2>
      </div>
    </div>
  </dialog>
  <script type="module" src="./app.mjs?v=2.9.1"></script>
  <script type="module" src="./updates.mjs?v=2.8.2"></script>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "cd0bcb47a03946d9a38bb46c95271505"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
