<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="calculator-version" content="2.5.0">
  <meta name="theme-color" content="#123e31">
  <meta name="description" content="حساب نقاط لعبة الهند للأفرقة واللعب الفردي.">
  <title>حاسبة الهند – النخبة</title>
  <link rel="stylesheet" href="./styles.css?v=2.5.0">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-top">
        <button id="check-update" type="button" aria-label="التحقق من تحديث الحاسبة" title="التحقق من تحديث الحاسبة" hidden>↻</button>
        <h1><span aria-hidden="true">♠</span> حاسبة الهند <span aria-hidden="true">♠</span></h1>
        <button id="reset" class="reset" type="button" hidden>مباراة جديدة <span aria-hidden="true">+</span></button>
      </div>
      <div class="edition-panel" role="img" aria-label="النخبة"></div>
    </div>
  </header>
  <aside class="update-banner shell" id="update-banner" hidden>
    <span role="status">يتوفر تحديث جديد</span>
    <button class="primary" id="apply-update" type="button">تحديث الآن</button>
  </aside>
  <main id="app" class="shell"></main>
  <div class="archive-launch shell"><button id="archive-open" class="secondary" type="button">سجل المباريات</button></div>
  <dialog id="archive-dialog" aria-labelledby="archive-title">
    <section class="panel">
      <div class="panel-heading"><h2 id="archive-title">سجل المباريات</h2>
        <button id="archive-close" class="secondary" type="button" autofocus>إغلاق</button></div>
      <div id="archive-content"></div>
    </section>
  </dialog>
  <footer class="version">الإصدار <bdi>2.5.0</bdi></footer>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="kabru-dialog" aria-labelledby="kabru-title">
    <div class="kabru-screen">
      <h1 id="kabru-title">كابروا</h1>
      <div class="kabru-stage" role="img"><div class="kabru-wheel"></div><span class="kabru-pointer"></span></div>
      <div id="kabru-result" role="status"></div>
      <div class="kabru-actions">
        <button id="kabru-spin" class="kabru-gold" type="button">كابروا</button>
        <button id="kabru-back" class="secondary" type="button">العودة للعبة</button>
      </div>
    </div>
  </dialog>
  <script type="module" src="./app.mjs?v=2.5.0"></script>
  <script type="module" src="./updates.mjs?v=2.5.0"></script>
</body>
</html>
